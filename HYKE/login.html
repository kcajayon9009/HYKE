<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>You Kenn Eat Here! — Log In</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="phone">

        <!-- MAIN LOGO -->
        <header class="brand">
            <img
                class="brand-logo"
                src="logo.jpg"
                alt="Here, You Kenn Eat"
            >
        </header>


        <!-- LOGIN -->
        <main class="login-body">

            <h2>Log In</h2>

            <form action="home.html">

                <div class="field">
                    <input
                        type="email"
                        placeholder="Email"
                        required
                    >

                    <span class="icon">✉</span>
                </div>


                <div class="field">
                    <input
                        type="password"
                        placeholder="Password"
                        required
                    >

                    <span class="icon">👁</span>
                </div>


                <button
                    type="submit"
                    class="btn-primary"
                >
                    Log In
                </button>

            </form>

        </main>


        <!-- SIGN UP LINK -->
        <footer class="login-footer">

            First time here?

            <a href="signup.html">
                Sign Up
            </a>

        </footer>


        <!-- HYKE FOOTER -->
        <div class="hyke">

            <div class="hyke-box">

                <img
                    src="HYKE.jpg"
                    alt="HYKE — Here You Kenn Eat"
                >

                <a
                    class="soc soc-fb"
                    href="https://facebook.com"
                    target="_blank"
                    rel="noopener"
                    aria-label="Facebook"
                ></a>

                <a
                    class="soc soc-ig"
                    href="https://instagram.com"
                    target="_blank"
                    rel="noopener"
                    aria-label="Instagram"
                ></a>

                <a
                    class="soc soc-tw"
                    href="https://twitter.com"
                    target="_blank"
                    rel="noopener"
                    aria-label="Twitter"
                ></a>

            </div>

        </div>

    </div>

</body>
</html>
