<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>You Kenn Eat Here! — Sign Up</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="phone">

        <!-- MAIN LOGO -->
        <header class="brand">

            <img
                class="brand-logo"
                src="logo.jpg"
                alt="Here, You Kenn Eat"
            >

        </header>


        <!-- SIGN UP HEADER -->
        <div class="signup-head">

            <h2>Sign Up</h2>

            <p>
                already have an account?

                <a href="login.html">
                    Log In
                </a>
            </p>

        </div>


        <!-- SIGN UP FORM -->
        <main class="signup-body">

            <p class="creating">
                Creating your account
            </p>


            <!-- BACK TO LOGIN AFTER SIGNING UP -->
            <form action="login.html">

                <div class="field">

                    <input
                        type="text"
                        placeholder="Full name"
                        required
                    >

                </div>


                <div class="field">

                    <input
                        type="email"
                        placeholder="Email Address"
                        required
                    >

                    <span class="icon">✉</span>

                </div>


                <div class="field">

                    <input
                        type="tel"
                        placeholder="+63  Mobile number"
                        required
                    >

                    <span class="icon">✆</span>

                </div>


                <div class="field">

                    <input
                        type="password"
                        placeholder="Password"
                        required
                    >

                    <span class="icon">👁</span>

                </div>


                <div class="field">

                    <input
                        type="password"
                        placeholder="Confirm password"
                        required
                    >

                    <span class="icon">👁</span>

                </div>


                <button
                    type="submit"
                    class="btn-signup"
                >
                    Sign Up
                </button>

            </form>


            <p class="or">
                Or
            </p>


            <a
                class="social-btn"
                href="#"
            >
                <span class="g">G</span>
                Sign up with Google
            </a>


            <a
                class="social-btn"
                href="#"
            >
                <span class="f">f</span>
                Sign up with Facebook
            </a>

        </main>


        <!-- HYKE FOOTER -->
        <div class="hyke">

            <div class="hyke-box">

                <img
                    src="HYKE.jpg"
                    alt="HYKE — Here You Kenn Eat"
                >

                <a
                    class="soc soc-fb"
                    href="https://facebook.com"
                    target="_blank"
                    rel="noopener"
                    aria-label="Facebook"
                ></a>

                <a
                    class="soc soc-ig"
                    href="https://instagram.com"
                    target="_blank"
                    rel="noopener"
                    aria-label="Instagram"
                ></a>

                <a
                    class="soc soc-tw"
                    href="https://twitter.com"
                    target="_blank"
                    rel="noopener"
                    aria-label="Twitter"
                ></a>

            </div>

        </div>

    </div>

</body>
</html>
