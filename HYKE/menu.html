<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You Kenn Eat Here! — Everyday's Menu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="phone menu-page">

    <!-- brand header -->
    <header class="brand">
      <img
        class="brand-logo"
        src="logo.jpg"
        alt="Here, You Kenn Eat"
      >
    </header>

    <h2 class="menu-title">Menu's for Of Monday-Saturday</h2>

    <!-- ================= MONDAY ================= -->
    <h3 class="menu-day-heading head-mon">Monday's Menu</h3>
    <section class="menu-band band-mon">
      <figure class="dish"><div class="photo">🥘</div><figcaption class="name">Afritada</figcaption></figure>
      <figure class="dish"><div class="photo">🐟</div><figcaption class="name">Daing na Bangus</figcaption></figure>
      <figure class="dish"><div class="photo">🍖</div><figcaption class="name">Dinuguan</figcaption></figure>
      <figure class="dish"><div class="photo">🍜</div><figcaption class="name">Singang na Baboy</figcaption></figure>
      <figure class="dish"><div class="photo">🥣</div><figcaption class="name">Mungggo</figcaption></figure>
    </section>

    <!-- ================= TUESDAY ================= -->
    <h3 class="menu-day-heading head-tue">Tuesday's Menu</h3>
    <section class="menu-band band-tue">
      <figure class="dish"><div class="photo">🍳</div><figcaption class="name">Sisig</figcaption></figure>
      <figure class="dish"><div class="photo">🐟</div><figcaption class="name">Galungoons</figcaption></figure>
      <figure class="dish"><div class="photo">🍖</div><figcaption class="name">Nilagang Baka</figcaption></figure>
      <figure class="dish"><div class="photo">🍗</div><figcaption class="name">Adcobong Manok</figcaption></figure>
      <figure class="dish"><div class="photo">🥘</div><figcaption class="name">Lainis</figcaption></figure>
    </section>

    <!-- ================= WEDNESDAY ================= -->
    <h3 class="menu-day-heading head-wed">Wednesday's Menu</h3>
    <section class="menu-band band-wed">
      <figure class="dish"><div class="photo">🍢</div><figcaption class="name">Barbeque</figcaption></figure>
      <figure class="dish"><div class="photo">🥩</div><figcaption class="name">Beef Steak</figcaption></figure>
      <figure class="dish"><div class="photo">🍲</div><figcaption class="name">Menudo</figcaption></figure>
      <figure class="dish"><div class="photo">🥘</div><figcaption class="name">Ginataang Kalabasa</figcaption></figure>
      <figure class="dish"><div class="photo">🐟</div><figcaption class="name">Pritong Tilapia</figcaption></figure>
    </section>

    <!-- ================= THURSDAY ================= -->
    <h3 class="menu-day-heading head-thu">Thursday's Menu</h3>
    <section class="menu-band band-thu">
      <figure class="dish"><div class="photo">🌶</div><figcaption class="name">Bicol Express</figcaption></figure>
      <figure class="dish"><div class="photo">🍜</div><figcaption class="name">Sinigang Manok</figcaption></figure>
      <figure class="dish"><div class="photo">🍚</div><figcaption class="name">Garlic</figcaption></figure>
      <figure class="dish"><div class="photo">🍛</div><figcaption class="name">Lanska</figcaption></figure>
      <figure class="dish"><div class="photo">🐟</div><figcaption class="name">Pritong Bangus</figcaption></figure>
    </section>

    <!-- ================= FRIDAY =================
         PLACEHOLDER dishes — the Figma frame cuts off here.
         Replace names/emojis with your real Friday line-up. -->
    <h3 class="menu-day-heading head-fri">Friday's Menu</h3>
    <section class="menu-band band-fri">
      <figure class="dish"><div class="photo">🥗</div><figcaption class="name">Chopsuey</figcaption></figure>
      <figure class="dish"><div class="photo">🍜</div><figcaption class="name">Pancit</figcaption></figure>
      <figure class="dish"><div class="photo">🌯</div><figcaption class="name">Lumpia</figcaption></figure>
      <figure class="dish"><div class="photo">🥟</div><figcaption class="name">Turon</figcaption></figure>
      <figure class="dish"><div class="photo">🍧</div><figcaption class="name">Halo-Halo</figcaption></figure>
    </section>

    <!-- ================= SATURDAY =================
         PLACEHOLDER dishes — not visible in the Figma frame. -->
    <h3 class="menu-day-heading head-sat">Saturday's Menu</h3>
    <section class="menu-band band-sat">
      <figure class="dish"><div class="photo">🍖</div><figcaption class="name">Lechon</figcaption></figure>
      <figure class="dish"><div class="photo">🥘</div><figcaption class="name">Kare-Kare</figcaption></figure>
      <figure class="dish"><div class="photo">🍗</div><figcaption class="name">Crispy Pata</figcaption></figure>
      <figure class="dish"><div class="photo">🍝</div><figcaption class="name">Palabok</figcaption></figure>
      <figure class="dish"><div class="photo">🥤</div><figcaption class="name">Sago't Gulaman</figcaption></figure>
    </section>

    <!-- back to home -->
    <a class="back-home" href="home.html">← Back to Home</a>

    <!-- HYKE brand footer -->
    <div class="hyke">
      <div class="hyke-box">

        <img
          src="HYKE.jpg"
          alt="HYKE — Here You Kenn Eat"
        >

        <a
          class="soc soc-fb"
          href="https://facebook.com"
          target="_blank"
          rel="noopener"
          aria-label="Facebook"
        ></a>

        <a
          class="soc soc-ig"
          href="https://instagram.com"
          target="_blank"
          rel="noopener"
          aria-label="Instagram"
        ></a>

        <a
          class="soc soc-tw"
          href="https://twitter.com"
          target="_blank"
          rel="noopener"
          aria-label="Twitter"
        ></a>

      </div>
    </div>

  </div>

</body>
</html>
